<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 320px;
      background-color: #13151a;
      color: #e3e5e8;
      font-family: 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
      box-sizing: border-box;
      user-select: none;
    }

    /* Roomy-style Brand Header */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #232733;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }
    .brand-subtitle {
      font-size: 11px;
      color: #8b92a5;
      margin-top: 2px;
    }

    /* 3-Way Segmented Selector Bar */
    .ai-selector {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      background: #181b22;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      margin-bottom: 16px;
    }
    .ai-tab {
      background: transparent;
      border: 1px solid transparent;
      color: #8b92a5;
      padding: 8px 4px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .ai-tab:hover {
      color: #d1d5db;
    }
    .ai-tab.active {
      background: #222631;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }
    .current-badge {
      display: none;
      font-size: 9px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(96, 165, 250, 0.18);
      color: #60a5fa;
      letter-spacing: 0.1px;
    }
    .ai-tab.is-current .current-badge {
      display: inline-block;
    }

    /* Enable Row with Status Dot */
    .enable-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 2px;
    }
    .enable-label-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #60a5fa;
      box-shadow: 0 0 8px rgba(96, 165, 250, 0.7);
      transition: background 0.25s, box-shadow 0.25s;
    }
    .status-dot.off {
      background: #4b5563;
      box-shadow: none;
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #2e3340; border-radius: 22px; transition: 0.25s;
    }
    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background-color: #13151a; border-radius: 50%; transition: 0.25s;
    }
    input:checked + .slider { background-color: #60a5fa; }
    input:checked + .slider:before { transform: translateX(18px); }

    /* Inner Card */
    .stats-card {
      background: #1b1e26;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 12px;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .stat-label {
      font-size: 11px;
      font-weight: 500;
      color: #8b92a5;
    }
    .stat-value {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }
    .mini-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 2px;
    }
    .mini-fill {
      height: 100%;
      background: #60a5fa;
      border-radius: 3px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
    .stat-reset {
      font-size: 11px;
      color: #8b92a5;
      margin-top: 2px;
    }

    /* Claude Free-Tier Helper Bar */
    #claudeHelper {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      color: #8b92a5;
    }
    .mini-btn-row {
      display: flex;
      gap: 6px;
    }
    .mini-btn {
      background: #262b36;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e3e5e8;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .mini-btn:hover { background: #323846; }

    /* Bottom Action Buttons */
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .action-btn {
      width: 100%;
      padding: 9px 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      background: #1b1e26;
      color: #e3e5e8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s;
    }
    .action-btn:hover {
      background: #242936;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .action-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="brand-header">
    <div class="brand-icon">
      <img src="icon.png" alt="Logo" />
    </div>
    <div>
      <div class="brand-title">Usage Limits</div>
      <div class="brand-subtitle">Multi-AI real-time limit tracker</div>
    </div>
  </div>

  <!-- 3-AI Segmented Selector -->
  <div class="ai-selector">
    <button class="ai-tab active" data-ai="gemini">
      <span>Gemini</span>
      <span class="current-badge">Current</span>
    </button>
    <button class="ai-tab" data-ai="chatgpt">
      <span>ChatGPT</span>
      <span class="current-badge">Current</span>
    </button>
    <button class="ai-tab" data-ai="claude">
      <span>Claude</span>
      <span class="current-badge">Current</span>
    </button>
  </div>

  <!-- Enable on Selected AI -->
  <div class="enable-row">
    <div class="enable-label-wrap">
      <span class="status-dot" id="statusDot"></span>
      <span id="enableLabel">Enable on Gemini</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggleAlwaysOn" checked>
      <span class="slider"></span>
    </label>
  </div>

  <!-- Usage Stats Card -->
  <div class="stats-card">
    <div class="stat-item">
      <div class="stat-top">
        <span class="stat-label">5-Hour Period</span>
        <span class="stat-value" id="fiveHourStat">--%</span>
      </div>
      <div class="mini-track">
        <div class="mini-fill" id="fiveHourFill" style="width: 0%;"></div>
      </div>
      <span class="stat-reset" id="fiveHourReset">Resets at --:--</span>
    </div>

    <div class="stat-item">
      <div class="stat-top">
        <span class="stat-label">Weekly Usage</span>
        <span class="stat-value" id="weeklyStat">--%</span>
      </div>
      <div class="mini-track">
        <div class="mini-fill" id="weeklyFill" style="width: 0%;"></div>
      </div>
      <span class="stat-reset" id="weeklyReset">Resets --</span>
    </div>

    <div id="claudeHelper">
      <span>Auto-tracks prompts (20/5h)</span>
      <div class="mini-btn-row">
        <button class="mini-btn" id="claudeAddMsg">+1 Msg</button>
        <button class="mini-btn" id="claudeReset5h">Reset</button>
      </div>
    </div>
  </div>

  <div class="button-group">
    <button class="action-btn" id="syncBtn">
      <span>↻ Sync Now</span>
    </button>
    <button class="action-btn" id="viewBtn">
      <span>↗ View Limits</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
